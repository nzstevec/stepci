version: "1.1"
name: Mock Organisation API
env:
  host: localhost:3001
  temp1: 1
  temp2: 2
tests:
  example:
    steps:
      - name: 11111 - Create organisation
        http:
          url: http://${{env.host}}/organisation
          method: POST
          headers:
            Content-Type: application/json
          json:
            name: Example Organisation
            shortName: "11111"
            emailAddress: contact@example.org
          captures:
            organisationId:
              jsonpath: $.id
            organisation:
              jsonpath: $
          check:
            status: 201
            jsonpath:
              $.id:
                - isNumber: true
              $.name: Example Organisation
              $.shortName: 11111
              $.emailAddress: contact@example.org
      - name: will be skipped
        if: env.temp1 != 1
        http:
          url: http://${{env.host}}/organisation/${{captures.organisationId}}
          method: GET
          captures:
            organisation:
              jsonpath: $
              update:
                shortName: 22222
          check:
            status: 200
            jsonpath:
              $.id:
                - isNumber: true
              $.name: Example Organisation
              $.shortName: 22222
              $.emailAddress: contact@example.org
      - name: 33333 - Create new organisation
        http:
          url: http://${{env.host}}/organisation
          method: POST
          headers:
            Content-Type: application/json
          json: ${{captures.organisation}}
          captures:
            organisationId:
              jsonpath: $.id
          check:
            status: 201
            jsonpath:
              $.id:
                - isNumber: true
              $.name: Example Organisation
              $.shortName: "11111"
              $.emailAddress: contact@example.org