version: "1.1"
name: Conditions
tests:
  example:
    steps:
      - name: GET request
        http:
          url: https://example.com
          method: GET
          check:
            status: 200
          captures:
            title:
              selector: title
      - name: Conditional request (skips)
        if: captures.title != "Example Domain"
        http:
          url: https://example.com
          method: GET
          check:
            status: 200
      - name: Continue after skipped condition
        http:
          url: https://example.com
          method: GET
          check:
            status: 200
