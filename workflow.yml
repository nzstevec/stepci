version: "1.1"
name: Validating JSON
tests:
  example:
    steps:
      - name: GET request
        http:
          url: https://jsonplaceholder.typicode.com/posts/1
          method: GET
          check:
            jsonpath:
              $.id: 1
          captures:
            body:
              jsonpath: $
              update:
                title: Hello Step CI!
                body: This is the body baby
      - name: Use updated capture
        http:
          url: https://jsonplaceholder.typicode.com/posts
          method: POST
          body: ${{ captures.body }}    
